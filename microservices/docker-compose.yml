services:
  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "5001:5000"
    volumes:
      - catalog_data:/data
    networks:
      - backend
    restart: unless-stopped

  notifications:
    build: ./notifications
    container_name: notifications
    ports:
      - "5003:5000"
    volumes:
      - notifications_data:/data
    networks:
      - backend
    restart: unless-stopped

  orders:
    build: ./orders
    container_name: orders
    ports:
      - "5002:5000"
    environment:
      CATALOG_URL: http://catalog:5000
      NOTIFICATIONS_URL: http://notifications:5000
    volumes:
      - orders_data:/data
    depends_on:
      - catalog
      - notifications
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  catalog_data:
  orders_data:
  notifications_data:
